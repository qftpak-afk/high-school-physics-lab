<!doctype html>
<html lang="th" class="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สเปกตรัมของแก๊สร้อน · High School Physics Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../../shared/lab.css">
<link rel="icon" href="../../../shared/icon.svg" type="image/svg+xml">
<style>
/* เฉพาะกิจกรรมนี้: ฟองระดับ ภาพสเปกตรัม และกรอบมองผ่านเกรตติง */
.lvl{height:24px;border:1px solid var(--rule);border-radius:12px;position:relative;background:var(--panel-2);overflow:hidden}
.lvl:before,.lvl:after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--mute)}
.lvl:before{left:calc(50% - 15px)} .lvl:after{left:calc(50% + 15px)}
.lvl i{position:absolute;top:3px;width:26px;height:16px;left:calc(50% - 13px);border-radius:8px;background:var(--metre)}
canvas#pic{width:100%;display:block;background:var(--panel-2);border:1px solid var(--rule)}
#frame{position:absolute;inset:0;pointer-events:none;border:14px solid #1d1a14;box-shadow:inset 0 0 70px 26px rgba(0,0,0,.72)}
@media (max-width:860px){#frame{border-width:8px}}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <div id="head"><a class="home" href="../../../">← หน้ารวมการทดลอง</a><small>กิจกรรม 1 · วิธีทดลองแบบ 3 มิติ</small><h1>การศึกษาสเปกตรัมของแก๊สร้อน</h1></div>
    <nav id="stepper" aria-label="ขั้นตอนการทดลอง"></nav>
    <div id="body"></div>
    <div id="foot">
      <button id="back" type="button">ย้อนกลับ</button>
      <button id="auto" type="button">ทำขั้นนี้ให้</button>
      <button id="next" type="button">ขั้นถัดไป</button>
    </div>
  </aside>
  <main id="stage">
    <div id="labels"></div>
    <div id="frame" hidden></div>
    <div id="hud"></div>
    <div id="tools">
      <button id="wide" type="button" hidden>กลับมุมกว้าง</button>
      <button id="naked" type="button" hidden>เอาเกรตติงออก</button>
      <button id="openSheet" type="button">ตารางบันทึกผล</button>
      <button id="reset" type="button">เริ่มใหม่</button>
    </div>
    <section id="sheet" hidden aria-label="ตารางบันทึกผลการทดลอง">
      <header><h3>ตารางบันทึกผลการทดลอง</h3><button id="closeSheet" type="button">ปิด</button></header>
      <div id="sheetMeta"></div>
      <div id="sheetWrap"></div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
